version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: voxfatura_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - voxfatura_network

  web:
    build: .
    container_name: voxfatura_api
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=${DATABASE_URL}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/venv
      - /app/db_data
    networks:
      - voxfatura_network

volumes:
  pgdata:
    driver: local

networks:
  voxfatura_network:
    driver: bridge
